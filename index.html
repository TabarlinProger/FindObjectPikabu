<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Найди капибар Поиск предметов</title>
    <link rel="icon" href="favicon.ico" sizes="32x32">
    <style>
      html, body { width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden; background: #231f20; }
      #unity-canvas { position: absolute; inset: 0; display: block; width: 100%; height: 100%; border: 0; outline: none; touch-action: none; }
      #loading-screen { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; justify-content: space-between; align-items: center; padding: 5vh 4vw; box-sizing: border-box; background: #28552d url('loading-background.jpg') center / cover no-repeat; }
      #loading-title { margin: 0; color: #ffe56f; font: bold clamp(28px, 6vw, 64px) sans-serif; text-shadow: 2px 3px 0 #673408, -1px -1px 0 #673408; }
      #loading-progress { width: min(76vw, 640px); height: clamp(20px, 4vh, 38px); border: 5px solid #a85b16; border-radius: 40px; background: #39230e; box-shadow: 0 0 0 2px #f5ca59; overflow: hidden; }
      #loading-fill { width: 0; height: 100%; border-radius: inherit; background: linear-gradient(#d5ff48, #62d800 55%, #299500); transition: width .15s linear; }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" width="960" height="600" tabindex="-1"></canvas>
    <div id="loading-screen" role="status" aria-label="Загрузка игры">
      <h1 id="loading-title">Загрузка…</h1>
      <div id="loading-progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="loading-fill"></div></div>
    </div>
    <script>
      var canvas = document.getElementById('unity-canvas');
      window.hideGameLoadingScreen = function () {
        var screen = document.getElementById('loading-screen');
        if (screen) screen.remove();
      };
      function loadingFailed(error) {
        console.error(error);
        var title = document.getElementById('loading-title');
        if (title) title.textContent = 'Не удалось загрузить игру. Обновите страницу.';
      }
      function startUnity() {
        createUnityInstance(canvas, {
        arguments: [],
        dataUrl: 'Build/FindObjectPikabu.data.unityweb',
        frameworkUrl: 'Build/FindObjectPikabu.framework.js.unityweb',
        codeUrl: 'Build/FindObjectPikabu.wasm.unityweb',
        streamingAssetsUrl: 'StreamingAssets',
        companyName: "MikoGamesStudio",
        productName: "Найди капибар Поиск предметов",
        productVersion: "1.0",
        matchWebGLToCanvasSize: true
        }, function (progress) {
          var value = Math.round(Math.min(1, Math.max(0, progress)) * 95);
          var fill = document.getElementById('loading-fill');
          var bar = document.getElementById('loading-progress');
          if (fill) fill.style.width = value + '%';
          if (bar) bar.setAttribute('aria-valuenow', value);
        }).then(function (instance) {
        window.unityInstance = instance;
        // Keep the screen until Unity has rendered its loading UI or the first level.
        }).catch(loadingFailed);
      }
      // Paint the loading screen before downloading/executing Unity's loader.
      requestAnimationFrame(function () { requestAnimationFrame(function () {
        var script = document.createElement('script');
        script.src = 'Build/FindObjectPikabu.loader.js';
        script.onload = startUnity;
        script.onerror = loadingFailed;
        document.body.appendChild(script);
      }); });
    </script>
  </body>
</html>
